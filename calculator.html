<html lang="uk">
<head>
  <meta charset="UTF-8" />

  <meta name="description" data-i18n-content="metaDescription" content="Runory — калькулятор бігу: час, дистанція та темп." />
  <title>Runory — калькулятор бігу</title>
<link rel="stylesheet" href="/src/styles-v12.css" />
<main class="page-shell">

      <section class="calculator-view">


    <div class="calculator-intro">

      <p class="eyebrow" data-i18n="calculatorEyebrow">ІНСТРУМЕНТ БІГУНА</p>

      <h1 data-i18n="heroTitle">Плануй забіг<br />у цифрах.</h1>

      <p data-i18n="heroCopy">Введи два значення — Runory одразу порахує третє.</p>

    </div>


    <div
      class="calculator-tabs"
      role="tablist"
      aria-label="Тип розрахунку" data-i18n-aria="calculatorType"
    >

      <button class="calc-tab is-active" data-calculator="time" type="button" data-i18n="tabTime">Знайти час</button>

      <button class="calc-tab" data-calculator="distance" type="button" data-i18n="tabDistance">Знайти дистанцію</button>

      <button class="calc-tab" data-calculator="pace" type="button" data-i18n="tabPace">Знайти темп</button>

    </div>


    <div class="calculator-card">

      <div class="calculator-heading">

        <div>
          <p class="eyebrow" id="calc-eyebrow">
            ДИСТАНЦІЯ + ТЕМП
          </p>

          <h2 id="calc-title">
            Який буде час?
          </h2>
        </div>

        <p id="calc-description">
          Вкажи дистанцію та бажаний темп.
        </p>

      </div>


      <form id="calculatorForm" novalidate>

        <div
          class="calculator-fields"
          id="calculatorFields"
        ></div>

        <button class="calculate-button" type="submit" data-i18n="calculate">Розрахувати</button>

      </form>


      <div
        class="calculation-result"
        id="calculationResult"
        hidden
        aria-live="polite"
      >

        <p id="result-label" data-i18n="resultTime">Твій орієнтовний час</p>

        <strong id="result-value">
          —
        </strong>

        <span id="result-detail"></span>

      </div>

    </div>

  </section>

      </section>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// Shared Runory shell behavior for the standalone calculator page.
const RUNORY_SUPABASE_URL = "https://vabzqqptpzcoguvuujaz.supabase.co";
const RUNORY_SUPABASE_KEY = "sb_publishable_Jm_w-bNZJ8bnrGIbkzc5yw_IGZjneHN";
const runoryAuthClient = window.supabase?.createClient(RUNORY_SUPABASE_URL, RUNORY_SUPABASE_KEY);
const calculatorAuthButton = document.getElementById("calculatorAuthButton");
const calculatorAuthButtonText = document.getElementById("calculatorAuthButtonText");
async function syncCalculatorAuth() {
  if (!runoryAuthClient) return;
  const { data } = await runoryAuthClient.auth.getSession();
  const signedIn = !!data?.session?.user;
  calculatorAuthButton?.classList.toggle("is-signed-in", signedIn);
  if (calculatorAuthButtonText) calculatorAuthButtonText.textContent = signedIn ? "Акаунт" : "Увійти";
}
syncCalculatorAuth();
runoryAuthClient?.auth.onAuthStateChange(() => syncCalculatorAuth());
document.getElementById("addWorkoutButton")?.addEventListener("click", () => {
  window.location.href = "/";
});

const calculatorSidebar = document.getElementById("accountSidebar");
const calculatorSidebarToggle = document.getElementById("accountSidebarToggle");
const calculatorMobileToggle = document.getElementById("sidebarMobileToggle");
const calculatorMobileBackdrop = document.getElementById("sidebarMobileBackdrop");

calculatorSidebarToggle?.addEventListener("click", () => {
  const collapsed = calculatorSidebar.classList.toggle("is-collapsed");
  calculatorSidebarToggle.setAttribute("aria-expanded", String(!collapsed));
  calculatorSidebarToggle.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${collapsed ? "m9.5 6 6 6-6 6" : "m14.5 6-6 6 6 6"}"/></svg>`;
});

calculatorMobileToggle?.addEventListener("click", () => {
  calculatorSidebar.classList.add("is-open");
  calculatorMobileToggle.setAttribute("aria-expanded", "true");
  calculatorMobileBackdrop.classList.add("is-visible");
});

calculatorMobileBackdrop?.addEventListener("click", () => {
  calculatorSidebar.classList.remove("is-open");
  calculatorMobileToggle.setAttribute("aria-expanded", "false");
  calculatorMobileBackdrop.classList.remove("is-visible");
});

  en: {

    ariaHome: "Runory — home",

    authSignIn: "Sign in",

    heroCopy: "Enter two values — Runory will calculate the third instantly.",

    km: "km",

let currentLanguage = localStorage.getItem("runory-language") || "uk";
if (!calculatorTranslations[currentLanguage]) currentLanguage = "uk";

const t = key => calculatorTranslations[currentLanguage][key] ?? calculatorTranslations.uk[key] ?? key;

function applyLanguage() {
  document.documentElement.lang = currentLanguage;
  document.title = t("pageTitle");

  const meta = document.querySelector('meta[data-i18n-content="metaDescription"]');
  if (meta) meta.setAttribute("content", t("metaDescription"));

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  });
  document.querySelectorAll(".language-button").forEach(button => {
    const active = button.dataset.lang === currentLanguage;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  renderCalculator(activeCalculator);
}

function setLanguage(language) {
  if (!calculatorTranslations[language] || language === currentLanguage) return;
  currentLanguage = language;
  localStorage.setItem("runory-language", currentLanguage);
  applyLanguage();
}

</script>

<script>
const calculatorForm =
  document.querySelector('#calculatorForm');

const calculatorFields =
  document.querySelector('#calculatorFields');

const calculationResult =
  document.querySelector('#calculationResult');

const calcEyebrow =
  document.querySelector('#calc-eyebrow');

const calcTitle =
  document.querySelector('#calc-title');

const calcDescription =
  document.querySelector('#calc-description');

const resultLabel =
  document.querySelector('#result-label');

const resultValue =
  document.querySelector('#result-value');

const resultDetail =
  document.querySelector('#result-detail');

const calcTabs =
  document.querySelectorAll('.calc-tab');


const calculators = {

  time: {
    eyebrow: "timeEyebrow",
    title: "timeTitle",
    description: "timeDescription",
    label: "timeLabel",
    fields: ['distance', 'pace']
  },

  distance: {
    eyebrow: "distanceEyebrow",
    title: "distanceTitle",
    description: "distanceDescription",
    label: "distanceLabel",
    fields: ['time', 'pace']
  },

  pace: {
    eyebrow: "paceEyebrow",
    title: "paceTitle",
    description: "paceDescription",
    label: "paceLabel",
    fields: ['distance', 'time']
  }

};


let activeCalculator = 'time';


function renderCalculator(type) {

  activeCalculator = type;

  const calculator =
    calculators[type];

  calcTabs.forEach(tab => {

    tab.classList.toggle(
      'is-active',
      tab.dataset.calculator === type
    );

  });


  calcEyebrow.textContent =
    t(calculator.eyebrow);

  calcTitle.textContent =
    t(calculator.title);

  calcDescription.textContent =
    t(calculator.description);


  calculatorFields.innerHTML =
    calculator.fields.map(field => {

      if (field === 'distance') {

        return `
          <label class="calc-field">

            <span>${t("distance")}</span>

            <div>

              <input
                name="distance"
                inputmode="decimal"
                autocomplete="off"
                placeholder="${t("exampleDistance")}"
                required
              />

              <em>км</em>

            </div>

          </label>
        `;

      }


      if (field === 'time') {

        return `
          <fieldset class="calc-field time-field">

            <legend>${t("time")}</legend>

            <div class="split-inputs">

              <label>
                <input
                  name="timeHours"
                  type="number"
                  min="0"
                  inputmode="numeric"
                  placeholder="0"
                />
                <span>${t("hours")}</span>
              </label>

              <label>
                <input
                  name="timeMinutes"
                  type="number"
                  min="0"
                  max="59"
                  inputmode="numeric"
                  placeholder="00"
                />
                <span>${t("minutes")}</span>
              </label>

              <label>
                <input
                  name="timeSeconds"
                  type="number"
                  min="0"
                  max="59"
                  inputmode="numeric"
                  placeholder="00"
                />
                <span>${t("seconds")}</span>
              </label>

            </div>

          </fieldset>
        `;

      }


      return `
        <fieldset class="calc-field time-field">

          <legend>${t("pace")}</legend>

          <div class="split-inputs">

            <label>
              <input
                name="paceMinutes"
                type="number"
                min="0"
                inputmode="numeric"
                placeholder="5"
                required
              />
              <span>${t("minutes")}</span>
            </label>

            <label>
              <input
                name="paceSeconds"
                type="number"
                min="0"
                max="59"
                inputmode="numeric"
                placeholder="30"
                required
              />
              <span>${t("seconds")}</span>
            </label>

          </div>

        </fieldset>
      `;

    }).join('');


  calculationResult.hidden = true;

}


function readNumber(data, name) {

  const value = data.get(name);

  return value === '' || value === null
    ? 0
    : Number(value);

}


function formatDuration(seconds) {

  const total =
    Math.round(seconds);

  const hours =
    Math.floor(total / 3600);

  const minutes =
    Math.floor((total % 3600) / 60);

  const rest =
    String(total % 60).padStart(2, '0');


  return hours
    ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}`
    : `${minutes}:${rest}`;

}


calculatorForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const data =
      new FormData(calculatorForm);


    const distance =
      Number(
        String(data.get('distance') || '')
          .replace(',', '.')
      );


    const hours =
      readNumber(data, 'timeHours');

    const minutes =
      readNumber(data, 'timeMinutes');

    const seconds =
      readNumber(data, 'timeSeconds');


    const paceMinutes =
      readNumber(data, 'paceMinutes');

    const paceSeconds =
      readNumber(data, 'paceSeconds');


    const time =
      hours * 3600 +
      minutes * 60 +
      seconds;


    const pace =
      paceMinutes * 60 +
      paceSeconds;


    let value;
    let detail;


    if (
      activeCalculator === 'time' &&
      distance > 0 &&
      pace > 0
    ) {

      value =
        formatDuration(distance * pace);

      detail = '';

    }


    if (
      activeCalculator === 'distance' &&
      time > 0 &&
      pace > 0
    ) {

      value =
        (time / pace).toFixed(2);

      detail = '';

    }


    if (
      activeCalculator === 'pace' &&
      distance > 0 &&
      time > 0
    ) {

      value =
        formatDuration(time / distance);

      detail = '';
    }


    if (
      !value ||
      minutes > 59 ||
      seconds > 59 ||
      paceSeconds > 59
    ) {

      resultLabel.textContent = t("checkValues");

      resultValue.textContent =
        '—';

      resultDetail.textContent = t("rangeError");

    } else {

      resultLabel.textContent = t(calculators[activeCalculator].label);

      resultValue.textContent =
        activeCalculator === 'distance'
          ? `${value} ${t("km")}`
          : activeCalculator === 'pace'
            ? `${value} ${t("perKm")}`
            : value;

      resultDetail.textContent =
        detail;

    }


    calculationResult.hidden = false;

  }
);


calcTabs.forEach(tab => {

  tab.addEventListener(
    'click',
    () => renderCalculator(
      tab.dataset.calculator
    )
  );

});


document.querySelectorAll(".language-button").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

renderCalculator("time");
applyLanguage();

</script>

</body>
