<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Runory — калькулятор бігу: час, дистанція та темп." data-i18n-content="metaDescription"
  />

  <title data-i18n-title="pageTitle">Runory — калькулятор бігу</title>
<link rel="icon" href="src/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="src/styles.css" />
</head>

<body>

<main class="page-shell">

  <header class="topbar">
      <a class="brand" href="index.html" aria-label="Runory — головна" data-i18n-aria="ariaHome">
        <img class="brand-logo" src="src/assets/runory-logo.svg" alt="Runory" />
      </a>

      <div class="topbar-right">
        <nav class="app-nav" aria-label="Розділи Runory" data-i18n-aria="ariaNav">
          <a class="nav-tab" href="index.html" style="text-decoration:none;">
            <span data-i18n="navAnalysis">Аналіз тренування</span>
          </a>
          <a class="nav-tab is-active" href="calculator.html" style="text-decoration:none;">
            <span data-i18n="navCalculator">Калькулятор бігу</span>
          </a>
        </nav>

        <div class="language-switcher" role="group" aria-label="Мова" data-i18n-aria="language">
          <button type="button" class="language-button is-active" data-lang="uk" aria-pressed="true">UA</button>
          <button type="button" class="language-button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>


  <section class="calculator-view">

    <div class="calculator-intro">

      <p class="eyebrow" data-i18n="calculatorEyebrow">ІНСТРУМЕНТ БІГУНА</p>

      <h1 data-i18n="heroTitle">Плануй забіг<br />у цифрах.</h1>

      <p data-i18n="heroCopy">Введи два значення — Runory одразу порахує третє.</p>

    </div>


    <div
      class="calculator-tabs"
      role="tablist"
      aria-label="Тип розрахунку" data-i18n-aria="calculatorType"
    >

      <button class="calc-tab is-active" data-calculator="time" type="button" data-i18n="tabTime">Знайти час</button>

      <button class="calc-tab" data-calculator="distance" type="button" data-i18n="tabDistance">Знайти дистанцію</button>

      <button class="calc-tab" data-calculator="pace" type="button" data-i18n="tabPace">Знайти темп</button>

    </div>


    <div class="calculator-card">

      <div class="calculator-heading">

        <div>
          <p class="eyebrow" id="calc-eyebrow">
            ДИСТАНЦІЯ + ТЕМП
          </p>

          <h2 id="calc-title">
            Який буде час?
          </h2>
        </div>

        <p id="calc-description">
          Вкажи дистанцію та бажаний темп.
        </p>

      </div>


      <form id="calculatorForm" novalidate>

        <div
          class="calculator-fields"
          id="calculatorFields"
        ></div>

        <button class="calculate-button" type="submit" data-i18n="calculate">Розрахувати</button>

      </form>


      <div
        class="calculation-result"
        id="calculationResult"
        hidden
        aria-live="polite"
      >

        <p id="result-label" data-i18n="resultTime">Твій орієнтовний час</p>

        <strong id="result-value">
          —
        </strong>

        <span id="result-detail"></span>

      </div>

    </div>

  </section>

</main>


<script>
const calculatorTranslations = {
  uk: {
    pageTitle: "Runory — калькулятор бігу",
    metaDescription: "Runory — калькулятор бігу: час, дистанція та темп.",
    ariaHome: "Runory — головна",
    ariaNav: "Розділи Runory",
    language: "Мова",
    navAnalysis: "Аналіз тренування",
    navCalculator: "Калькулятор бігу",
    calculatorEyebrow: "ІНСТРУМЕНТ БІГУНА",
    heroTitle: "Плануй забіг<br />у цифрах.",
    heroCopy: "Введи два значення — Runory одразу порахує третє.",
    calculatorType: "Тип розрахунку",
    tabTime: "Знайти час",
    tabDistance: "Знайти дистанцію",
    tabPace: "Знайти темп",
    timeEyebrow: "ДИСТАНЦІЯ + ТЕМП",
    timeTitle: "Який буде час?",
    timeDescription: "Вкажи дистанцію та бажаний темп.",
    timeLabel: "Твій орієнтовний час",
    distanceEyebrow: "ЧАС + ТЕМП",
    distanceTitle: "Яка буде дистанція?",
    distanceDescription: "Вкажи час, який маєш, і свій темп.",
    distanceLabel: "Твоя орієнтовна дистанція",
    paceEyebrow: "ДИСТАНЦІЯ + ЧАС",
    paceTitle: "Який потрібен темп?",
    paceDescription: "Вкажи дистанцію та бажаний фінішний час.",
    paceLabel: "Твій потрібний темп",
    distance: "Дистанція",
    time: "Час",
    pace: "Темп на кілометр",
    exampleDistance: "Наприклад, 21.1",
    hours: "год",
    minutes: "хв",
    seconds: "сек",
    calculate: "Розрахувати",
    resultTime: "Твій орієнтовний час",
    checkValues: "Перевір введені значення",
    rangeError: "Хвилини та секунди мають бути від 0 до 59.",
    km: "км",
    perKm: "/ км"
  },
  en: {
    pageTitle: "Runory — running calculator",
    metaDescription: "Runory — running calculator for time, distance and pace.",
    ariaHome: "Runory — home",
    ariaNav: "Runory sections",
    language: "Language",
    navAnalysis: "Workout analysis",
    navCalculator: "Running calculator",
    calculatorEyebrow: "RUNNER'S TOOL",
    heroTitle: "Plan your run<br />with numbers.",
    heroCopy: "Enter two values — Runory will calculate the third instantly.",
    calculatorType: "Calculation type",
    tabTime: "Find time",
    tabDistance: "Find distance",
    tabPace: "Find pace",
    timeEyebrow: "DISTANCE + PACE",
    timeTitle: "What will the time be?",
    timeDescription: "Enter the distance and target pace.",
    timeLabel: "Your estimated time",
    distanceEyebrow: "TIME + PACE",
    distanceTitle: "What will the distance be?",
    distanceDescription: "Enter the time you have and your pace.",
    distanceLabel: "Your estimated distance",
    paceEyebrow: "DISTANCE + TIME",
    paceTitle: "What pace do you need?",
    paceDescription: "Enter the distance and target finish time.",
    paceLabel: "Your required pace",
    distance: "Distance",
    time: "Time",
    pace: "Pace per kilometer",
    exampleDistance: "For example, 21.1",
    hours: "hr",
    minutes: "min",
    seconds: "sec",
    calculate: "Calculate",
    resultTime: "Your estimated time",
    checkValues: "Check the entered values",
    rangeError: "Minutes and seconds must be between 0 and 59.",
    km: "km",
    perKm: "/ km"
  }
};

let currentLanguage = localStorage.getItem("runory-language") || "uk";
if (!calculatorTranslations[currentLanguage]) currentLanguage = "uk";

const t = key => calculatorTranslations[currentLanguage][key] ?? calculatorTranslations.uk[key] ?? key;

function applyLanguage() {
  document.documentElement.lang = currentLanguage;
  document.title = t("pageTitle");

  const meta = document.querySelector('meta[data-i18n-content="metaDescription"]');
  if (meta) meta.setAttribute("content", t("metaDescription"));

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    el.setAttribute("aria-label", t(el.dataset.i18nAria));
  });
  document.querySelectorAll(".language-button").forEach(button => {
    const active = button.dataset.lang === currentLanguage;
    button.classList.toggle("is-active", active);
    button.setAttribute("aria-pressed", String(active));
  });

  renderCalculator(activeCalculator);
}

function setLanguage(language) {
  if (!calculatorTranslations[language] || language === currentLanguage) return;
  currentLanguage = language;
  localStorage.setItem("runory-language", currentLanguage);
  applyLanguage();
}

</script>

<script>
const calculatorForm =
  document.querySelector('#calculatorForm');

const calculatorFields =
  document.querySelector('#calculatorFields');

const calculationResult =
  document.querySelector('#calculationResult');

const calcEyebrow =
  document.querySelector('#calc-eyebrow');

const calcTitle =
  document.querySelector('#calc-title');

const calcDescription =
  document.querySelector('#calc-description');

const resultLabel =
  document.querySelector('#result-label');

const resultValue =
  document.querySelector('#result-value');

const resultDetail =
  document.querySelector('#result-detail');

const calcTabs =
  document.querySelectorAll('.calc-tab');


const calculators = {

  time: {
    eyebrow: "timeEyebrow",
    title: "timeTitle",
    description: "timeDescription",
    label: "timeLabel",
    fields: ['distance', 'pace']
  },

  distance: {
    eyebrow: "distanceEyebrow",
    title: "distanceTitle",
    description: "distanceDescription",
    label: "distanceLabel",
    fields: ['time', 'pace']
  },

  pace: {
    eyebrow: "paceEyebrow",
    title: "paceTitle",
    description: "paceDescription",
    label: "paceLabel",
    fields: ['distance', 'time']
  }

};


let activeCalculator = 'time';


function renderCalculator(type) {

  activeCalculator = type;

  const calculator =
    calculators[type];

  calcTabs.forEach(tab => {

    tab.classList.toggle(
      'is-active',
      tab.dataset.calculator === type
    );

  });


  calcEyebrow.textContent =
    t(calculator.eyebrow);

  calcTitle.textContent =
    t(calculator.title);

  calcDescription.textContent =
    t(calculator.description);


  calculatorFields.innerHTML =
    calculator.fields.map(field => {

      if (field === 'distance') {

        return `
          <label class="calc-field">

            <span>${t("distance")}</span>

            <div>

              <input
                name="distance"
                inputmode="decimal"
                autocomplete="off"
                placeholder="${t("exampleDistance")}"
                required
              />

              <em>км</em>

            </div>

          </label>
        `;

      }


      if (field === 'time') {

        return `
          <fieldset class="calc-field time-field">

            <legend>${t("time")}</legend>

            <div class="split-inputs">

              <label>
                <input
                  name="timeHours"
                  type="number"
                  min="0"
                  inputmode="numeric"
                  placeholder="0"
                />
                <span>${t("hours")}</span>
              </label>

              <label>
                <input
                  name="timeMinutes"
                  type="number"
                  min="0"
                  max="59"
                  inputmode="numeric"
                  placeholder="00"
                />
                <span>${t("minutes")}</span>
              </label>

              <label>
                <input
                  name="timeSeconds"
                  type="number"
                  min="0"
                  max="59"
                  inputmode="numeric"
                  placeholder="00"
                />
                <span>${t("seconds")}</span>
              </label>

            </div>

          </fieldset>
        `;

      }


      return `
        <fieldset class="calc-field time-field">

          <legend>${t("pace")}</legend>

          <div class="split-inputs">

            <label>
              <input
                name="paceMinutes"
                type="number"
                min="0"
                inputmode="numeric"
                placeholder="5"
                required
              />
              <span>${t("minutes")}</span>
            </label>

            <label>
              <input
                name="paceSeconds"
                type="number"
                min="0"
                max="59"
                inputmode="numeric"
                placeholder="30"
                required
              />
              <span>${t("seconds")}</span>
            </label>

          </div>

        </fieldset>
      `;

    }).join('');


  calculationResult.hidden = true;

}


function readNumber(data, name) {

  const value = data.get(name);

  return value === '' || value === null
    ? 0
    : Number(value);

}


function formatDuration(seconds) {

  const total =
    Math.round(seconds);

  const hours =
    Math.floor(total / 3600);

  const minutes =
    Math.floor((total % 3600) / 60);

  const rest =
    String(total % 60).padStart(2, '0');


  return hours
    ? `${hours}:${String(minutes).padStart(2, '0')}:${rest}`
    : `${minutes}:${rest}`;

}


calculatorForm.addEventListener(
  'submit',
  event => {

    event.preventDefault();

    const data =
      new FormData(calculatorForm);


    const distance =
      Number(
        String(data.get('distance') || '')
          .replace(',', '.')
      );


    const hours =
      readNumber(data, 'timeHours');

    const minutes =
      readNumber(data, 'timeMinutes');

    const seconds =
      readNumber(data, 'timeSeconds');


    const paceMinutes =
      readNumber(data, 'paceMinutes');

    const paceSeconds =
      readNumber(data, 'paceSeconds');


    const time =
      hours * 3600 +
      minutes * 60 +
      seconds;


    const pace =
      paceMinutes * 60 +
      paceSeconds;


    let value;
    let detail;


    if (
      activeCalculator === 'time' &&
      distance > 0 &&
      pace > 0
    ) {

      value =
        formatDuration(distance * pace);

      detail = '';

    }


    if (
      activeCalculator === 'distance' &&
      time > 0 &&
      pace > 0
    ) {

      value =
        (time / pace).toFixed(2);

      detail = '';

    }


    if (
      activeCalculator === 'pace' &&
      distance > 0 &&
      time > 0
    ) {

      value =
        formatDuration(time / distance);

      detail = '';
    }


    if (
      !value ||
      minutes > 59 ||
      seconds > 59 ||
      paceSeconds > 59
    ) {

      resultLabel.textContent = t("checkValues");

      resultValue.textContent =
        '—';

      resultDetail.textContent = t("rangeError");

    } else {

      resultLabel.textContent = t(calculators[activeCalculator].label);

      resultValue.textContent =
        activeCalculator === 'distance'
          ? `${value} ${t("km")}`
          : activeCalculator === 'pace'
            ? `${value} ${t("perKm")}`
            : value;

      resultDetail.textContent =
        detail;

    }


    calculationResult.hidden = false;

  }
);


calcTabs.forEach(tab => {

  tab.addEventListener(
    'click',
    () => renderCalculator(
      tab.dataset.calculator
    )
  );

});


document.querySelectorAll(".language-button").forEach(button => {
  button.addEventListener("click", () => setLanguage(button.dataset.lang));
});

renderCalculator("time");
applyLanguage();

</script>

</body>
</html>
