<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runory — Діагностика входу</title>
  <style>
    body{margin:0;min-height:100vh;background:#f6f7f5;color:#18201b;font-family:Arial,sans-serif}
    main{max-width:760px;margin:0 auto;padding:48px 22px}
    h2{margin:0 0 18px}
    .box{background:#fff;border:1px solid #dfe5e1;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    .ok{color:#18794e}.bad{color:#b42318}.muted{color:#68746d}
    pre{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;margin:0}
    button{margin-top:18px;border:0;border-radius:10px;padding:12px 16px;background:#18201b;color:#fff;font-size:15px}
  </style>
</head>
<body>
<main>
  <h2>Runory</h2>
  <div class="box"><pre id="status">Перевіряємо вхід…</pre></div>
  <div class="box"><pre id="details">Збираємо діагностику…</pre></div>
  <button onclick="location.href='/'">Повернутися до Runory</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vabzqqptpzcoguvuujaz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Jm_w-bNZJ8bnrGIbkzc5yw_IGZjneHN";
const statusEl = document.getElementById('status');
const detailsEl = document.getElementById('details');

function safeKeys(storage) {
  try {
    return Object.keys(storage).filter(k => /supabase|sb-|verifier|pkce|code/i.test(k));
  } catch (_) { return ['<недоступно>']; }
}
function setStatus(text, cls='') {
  statusEl.className = cls;
  statusEl.textContent = text;
}
function setDetails(lines) { detailsEl.textContent = lines.join('\n'); }

(async () => {
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  const flowId = url.searchParams.get('sb_flow_id');
  const oauthError = url.searchParams.get('error');
  const oauthErrorDescription = url.searchParams.get('error_description');

  const localKeys = safeKeys(localStorage);
  const sessionKeys = safeKeys(sessionStorage);

  setDetails([
    `origin: ${location.origin}`,
    `path: ${location.pathname}`,
    `code у URL: ${code ? 'ТАК' : 'НІ'}`,
    `sb_flow_id: ${flowId ? 'ТАК' : 'НІ'}`,
    `localStorage auth/PKCE ключі: ${localKeys.length ? localKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
    `sessionStorage auth/PKCE ключі: ${sessionKeys.length ? sessionKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
    `OAuth error: ${oauthError || 'немає'}`,
    `OAuth error_description: ${oauthErrorDescription || 'немає'}`
  ]);

  if (!code) {
    setStatus('❌ У callback немає code. Запусти вхід ще раз.', 'bad');
    return;
  }

  setStatus('Код отримано. Виконуємо обмін PKCE…');

  try {
    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
          flowType: 'pkce'
        }
      }
    );

    const exchange = flowId
      ? await supabase.auth.exchangeCodeForSession(code, { flowId })
      : await supabase.auth.exchangeCodeForSession(code);

    if (exchange.error) {
      setStatus('❌ Supabase відхилив обмін коду', 'bad');
      setDetails([
        `origin: ${location.origin}`,
        `path: ${location.pathname}`,
        `code у URL: ТАК`,
        `sb_flow_id: ${flowId ? 'ТАК' : 'НІ'}`,
        `localStorage auth/PKCE ключі: ${localKeys.length ? localKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
        `sessionStorage auth/PKCE ключі: ${sessionKeys.length ? sessionKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
        '',
        `error.name: ${exchange.error.name || '—'}`,
        `error.message: ${exchange.error.message || '—'}`,
        `error.code: ${exchange.error.code || '—'}`,
        `error.status: ${exchange.error.status || '—'}`
      ]);
      return;
    }

    if (!exchange.data?.session) {
      setStatus('❌ Обмін пройшов, але session не отримана', 'bad');
      return;
    }

    setStatus('✅ Вхід успішний. Переходимо в Runory…', 'ok');
    setDetails([
      `origin: ${location.origin}`,
      `path: ${location.pathname}`,
      `code у URL: ТАК`,
      `sb_flow_id: ${flowId ? 'ТАК' : 'НІ'}`,
      '',
      'Supabase session: ОТРИМАНА',
      `user id: ${exchange.data.session.user?.id ? 'отриманий' : 'відсутній'}`
    ]);

    history.replaceState({}, document.title, '/auth/callback.html');
    setTimeout(() => location.replace('/'), 700);
  } catch (err) {
    setStatus('❌ JavaScript помилка під час обміну', 'bad');
    setDetails([
      `origin: ${location.origin}`,
      `path: ${location.pathname}`,
      `code у URL: ${code ? 'ТАК' : 'НІ'}`,
      `sb_flow_id: ${flowId ? 'ТАК' : 'НІ'}`,
      `localStorage auth/PKCE ключі: ${localKeys.length ? localKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
      `sessionStorage auth/PKCE ключі: ${sessionKeys.length ? sessionKeys.join(', ') : 'НЕ ЗНАЙДЕНО'}`,
      '',
      `error.name: ${err?.name || '—'}`,
      `error.message: ${err?.message || '—'}`,
      `error.code: ${err?.code || '—'}`,
      `error.status: ${err?.status || '—'}`
    ]);
  }
})();
</script>
</body>
</html>
