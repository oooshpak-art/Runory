<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runory — Вхід</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f5;color:#18201b;font-family:Arial,sans-serif}
    main{text-align:center;padding:32px}
    p{color:#68746d}
  </style>
</head>
<body>
  <main>
    <strong>Runory</strong>
    <p id="status">Завершуємо вхід…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = "https://vabzqqptpzcoguvuujaz.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Jm_w-bNZJ8bnrGIbkzc5yw_IGZjneHN";

    // PKCE is used for the Google sign-in flow. The callback only exchanges
    // the short-lived authorization code for a Supabase session.
    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      }
    );

    const status = document.querySelector('#status');

    function showError(message) {
      status.textContent = message || 'Не вдалося завершити вхід. Спробуй ще раз.';
    }

    (async () => {
      try {
        const url = new URL(window.location.href);
        const errorDescription =
          url.searchParams.get('error_description') ||
          url.searchParams.get('error');

        if (errorDescription) {
          showError(decodeURIComponent(errorDescription.replace(/\+/g, ' ')));
          return;
        }

        const code = url.searchParams.get('code');
        if (!code) {
          showError('Не вдалося отримати код входу від Google. Спробуй ще раз.');
          return;
        }

        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) {
          showError(error.message);
          return;
        }

        if (!data?.session) {
          showError('Сесію не вдалося створити. Спробуй ще раз.');
          return;
        }

        // Remove the OAuth code from the address bar before returning home.
        window.location.replace('/');
      } catch (error) {
        showError(error?.message || 'Не вдалося завершити вхід. Спробуй ще раз.');
      }
    })();
  </script>
</body>
</html>
